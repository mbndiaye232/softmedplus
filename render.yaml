services:
  - type: web
    name: softmedplus-backend
    env: node
    plan: free
    # Meme region que la base Supabase : l'application ouvre une transaction et
    # plusieurs requetes par appel d'API, chaque aller-retour se paie autant de fois.
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # A renseigner avec les MEMES valeurs que le .env local, et non generees
      # par Render : les deux environnements partagent la base Supabase.
      # HMAC_SECRET signe les QR codes des ordonnances - deux valeurs
      # differentes rendraient invérifiable une ordonnance emise ailleurs.
      # JWT_SECRET signe aussi les jetons du portail patient.
      - key: JWT_SECRET
        sync: false
      - key: HMAC_SECRET
        sync: false
      # Base Supabase : chaine de connexion a renseigner dans le tableau de bord
      # Render. Utiliser le role applicatif (ni superuser ni BYPASSRLS), pas le
      # role postgres, sinon l'isolation entre structures ne s'applique plus.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      # URL publique du service, pour les liens envoyes par email.
      - key: PUBLIC_BASE_URL
        sync: false
      # Cloudflare R2 Storage Bucket Settings (Set these in Render Dashboard)
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET_NAME
        value: softmedplus-storage
      - key: R2_PUBLIC_URL
        sync: false
