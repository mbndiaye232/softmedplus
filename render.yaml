services:
  - type: web
    name: softmedplus-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: HMAC_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: softmedplus-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      # Cloudflare R2 Storage Bucket Settings (Set these in Render Dashboard)
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET_NAME
        value: softmedplus-storage
      - key: R2_PUBLIC_URL
        sync: false

databases:
  - name: softmedplus-db
    plan: free
    databaseName: softmedplus
    user: softmedplus
